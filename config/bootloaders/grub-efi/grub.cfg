# Kola OS v0.1 - UEFI GRUB configuration
#
# GRUB cannot measure RAM, so both entries are identical at this layer:
# the initramfs decides whether `toram` applies (see
# config/hooks/normal/0300-kola-auto-toram.hook.chroot).
#
# NOTE: this file is copied into the EFI image by live-build. It assumes the
# Debian live layout /live/vmlinuz + /live/initrd.img (symlinks). build.sh
# warns if those paths are missing — verify on the first build in QEMU.

set default=0
set timeout=0

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod search_label

search --no-floppy --set=root --label KOLA_OS_0_1

if [ -z "${root}" ]; then
	set root=(cd0)
fi

menuentry "Kola OS" {
	linux /live/vmlinuz boot=live components quiet loglevel=3 vt.global_cursor_default=0 username=kola hostname=kola locales=en_US.UTF-8 keyboard-layouts=us keyboard-model=pc105 timezone=Africa/Dar_es_Salaam
	initrd /live/initrd.img
}

menuentry "Kola OS (safe graphics)" {
	linux /live/vmlinuz boot=live components quiet loglevel=3 nomodeset username=kola hostname=kola locales=en_US.UTF-8 keyboard-layouts=us keyboard-model=pc105 timezone=Africa/Dar_es_Salaam
	initrd /live/initrd.img
}
